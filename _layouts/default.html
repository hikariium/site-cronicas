<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
                <link rel="stylesheet" type="text/css" href="{{ '/static/site.css' | relative_url }}" />
                <script>
                    (function(){
                        try {
                            var v = window.API_URL;
                            if (!v || typeof v !== 'string' || !/^https?:\/\//.test(v)) {
                                window.API_URL = "https://site-cronicas-api.onrender.com";
                            }
                        } catch (e) {
                            window.API_URL = "https://site-cronicas-api.onrender.com";
                        }
                        // Expose static path for scripts to build correct URLs on GitHub Pages
                        try {
                            window.STATIC_PATH = "{{ '/static' | relative_url }}";
                        } catch (e) {
                            window.STATIC_PATH = '/static';
                        }
                    })();
                </script>
                <style>
                    /* Override hero background with correct base URL (processed by Jekyll) */
                    .hero-image {
                        background:
                            linear-gradient(135deg, rgba(7, 87, 160, .82), rgba(22, 131, 75, .64)),
                            url("{{ './static/home-hero.png' | relative_url }}") center/cover;
                    }
                </style>
    </head>

    <body>
        <div class="government-banner">Portal temático do Crônicas • projeto demonstrativo sem vínculo com o Governo Federal ou com a Justiça Eleitoral</div>
        <header class="navbar">
            <div class="nav-inner">
                <a href="{{ '/' | relative_url }}" class="navbar-brand">
                    <span class="brand-mark">東</span>
                    <span>{{ site.title }}</span>
                </a>
                <nav aria-label="Navegacao principal">
                    <a href="{{ '/' | relative_url }}" class="navbar-item">Inicio</a>
                    <a href="{{ '/about' | relative_url }}" class="navbar-item">Sobre</a>
                    <a href="{{ '/blog' | relative_url }}" class="navbar-item">{{ site.blog_name }}</a>
                    <a href="{{ '/voting' | relative_url }}" class="navbar-item">Votação</a>
                    <a href="{{ '/results' | relative_url }}" class="navbar-item">Resultados</a>
                    <a href="{{ '/voting' | relative_url }}" class="nav-order">Ir votar</a>
                </nav>
                <button id="muteToggle" type="button" class="audio-toggle" aria-pressed="false">Mutar música</button>
            </div>
        </header>

        <main class="body-content">
            {{ content }}
        </main>

        <footer class="site-footer">
            <div>
                <strong>{{ site.title }}</strong>
                <p>{{ site.description }}</p>
            </div>
            <div class="footer-links">
                <a href="{{ '/voting' | relative_url }}">Participar da votação</a>
                <a href="{{ '/about' | relative_url }}">Regras</a>
            </div>
        </footer>
        <div class="background-audio" aria-hidden="true">
            <iframe
                id="youtubeAudio"
                title="Música de fundo do portal"
                src="https://www.youtube.com/embed/n5z1Zmdcqow?autoplay=1&mute=0&enablejsapi=1&controls=0&loop=1&playlist=n5z1Zmdcqow&rel=0&playsinline=1"
                allow="autoplay; encrypted-media"
                loading="eager"></iframe>
        </div>
        <script src="{{ '/static/site.js' | relative_url }}"></script>
    </body>
</html>
